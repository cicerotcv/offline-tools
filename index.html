    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fbf9f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15172a" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint (mirrors ThemeProvider) to avoid a light flash.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();
    </script>
  </head>

    <div id="root"></div>
